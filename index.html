    />
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem("theme");
          var useDark =
            savedTheme === "dark" ||
            (!savedTheme && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", useDark);
          document.documentElement.style.colorScheme = useDark ? "dark" : "light";
        } catch (_) {
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", systemDark);
          document.documentElement.style.colorScheme = systemDark ? "dark" : "light";
        }
      })();
    </script>

      content="Holding, Proteção Patrimonial, Herança, Blindagem patrimonial, Regime de bens, planejamento sucessório, Governança corporativa, Inventário, Planejamento sucessório, Doação com reserva de usofruto, Holding imobiliária, Holding patrimonial, Holding familiar"
